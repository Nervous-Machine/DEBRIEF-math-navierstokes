spoken: >
  The Lean package Alpöge and Buckmaster posted on 20 November builds in full on a machine they have never touched,
  in twenty-three minutes, with nothing left open in the proof library and nothing beyond Lean's three standard
  axioms behind any of the nineteen theorems their own comparator files name. The statement files and the solution
  state those theorems identically. The holes the scan finds are the ones the authors describe: the statement files
  carry sorry by design, and the solution fills them. What the build shows is narrower than the paper's claim. Every
  route to blow-up in the package starts from a hypothesis the package does not discharge: a self-similar profile, a
  certificate, or cell-system data. The certificate the paper names by hash is not in the repository, so nothing
  here concludes that the Navier–Stokes equations blow up. It concludes that a certificate of the stated form would
  make them.
