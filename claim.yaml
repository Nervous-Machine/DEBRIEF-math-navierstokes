# Claim file for DEBRIEF/tools/new_mission.py. Plain words throughout; nothing here calls the claim proved, verified or a theorem.
name: navierstokes
label: "Navier–Stokes blow-up, unforced (Alpöge and Buckmaster)"
title: "The claimed finite-time blow-up of the unforced three-dimensional Navier–Stokes equations by Levent Alpöge and Tristan Buckmaster, released on 20 November 2026 as a paper and a Lean development"
area: "Partial differential equations: regularity of the Navier–Stokes equations"
rests_on: "a 79-page paper, a Lean 4 development whose statement files carry sorry and whose solution file proves them from a library, and a computer-assisted certificate that is named by hash and not yet released"
short_version: >-
  On 20 November 2026, the same morning as the Riemann Hypothesis note, Levent Alpöge and Tristan Buckmaster posted a
  79-page paper and a Lean 4 development in a personal GitHub repository, claiming that smooth, compactly supported,
  divergence-free initial data on three-dimensional space, and smooth periodic data on the torus, exist for which the
  Navier–Stokes equations without any force blow up in finite time, at every viscosity. In the Clay formulation this
  would refute alternatives (A) and (B) and establish (C) and (D) without the force that OpenAI's September claim used.
  The argument has two parts: a stability result, that one discretely self-similar solution of a certain kind forces
  blow-up, and the existence of such a solution near an approximate one that satisfies explicit inequalities, which the
  authors call a certificate. The certificate is not released; the paper gives its hash. That it satisfies the
  inequalities is checked by interval arithmetic outside the formalization. The authors say the write-up is unpolished
  and that they posted it rather than wait. Nobody independent has reported building the development or reading the
  argument. Everything here is open.
announcement_plain: "The claim was announced by Tristan Buckmaster on Mastodon and by the repository itself; the press reported it the same day."
problem:
  name: "Navier–Stokes existence and smoothness"
  url: https://www.claymath.org/millennium/navier-stokes-equation/
  posed: "one of the seven Clay Millennium Prize Problems (2000), formulated by Charles Fefferman as four alternatives: existence and smoothness on space (A) and on the torus (B), or breakdown on space (C) and on the torus (D)"
  plain: >-
    Do smooth solutions of the three-dimensional incompressible Navier–Stokes equations, started from smooth data, stay
    smooth for all time, or can the velocity become unbounded in finite time? Fefferman's formulation accepts either
    answer: a proof of existence and smoothness, with no force on space (A) or on the torus (B), or a proof of
    breakdown, which may use a smooth force, on space (C) or on the torus (D). A third-party Lean formalization of all
    four alternatives exists in DeepMind's formal-conjectures; it lists (A) and (B) as open and, since September 2026,
    (C) and (D) as solved on the strength of OpenAI's forced construction. This claim is the unforced case: it would
    refute (A) and (B) as stated there.
  formal_statement: {repo: google-deepmind/formal-conjectures, path: FormalConjectures/Millennium/NavierStokes.lean, commit: 2207c54d0dbe960de591d280f997b195bf3f6e28, blob_sha: c21ccbfb73a85a930970d3b93ad23bd4c97d082a, size: 14574, symbol: navier_stokes_existence_and_smoothness_R3}
claims:
  - by: "Levent Alpöge and Tristan Buckmaster"
    ai: "the Lean development's README says the formalization came first and a first draft of the paper was obtained from the Lean proof; the repository's two commits carry a Claude co-author line; Buckmaster's September statement on the pair's earlier results names Claude and OpenAI's Codex models"
    submitted: "2026-11-20"
    where: https://github.com/tristanbuckmaster/navier-stokes
    summary_plain: >-
      The paper's abstract says that smooth, compactly supported, divergence-free data on space, and smooth
      divergence-free data on the torus, exist whose solutions of the unforced three-dimensional Navier–Stokes equations
      blow up in finite time, converging in self-similar variables to a backward discretely self-similar solution and
      blowing up at its rate. Part one (its Theorem 1.1): a profile, a smooth nonzero solution of the self-similar
      equations that is periodic in self-similar time up to a linear isometry and has stated decay, implies this
      blow-up; the proof shows such a solution is stable up to finitely many directions. Part two (its Theorem 7.1): such
      a profile exists near an approximate one that satisfies explicit inequalities, the certificate. Appendix B
      describes the certificate's form; Appendix C the computation of the approximate profile.
    notes_plain: >-
      The certificate is not in the repository; the abstract gives its hash and says it will be released soon. That it
      satisfies the inequalities is checked, the authors say, by interval arithmetic at 128 bits with the Arb library
      through FLINT, which is not part of the formalization and not in the repository either. The Lean package is the
      working repository's, with one patch of 20 November applied to the cell-layer statements and dependent proofs, and
      the README says the patched package was not rebuilt when the repository was assembled. The README also says the
      formal proofs do not follow the paper's, that the formal statement of the certificate step stops at a weak profile
      where the paper obtains a smooth one, that the formal definition of a certificate asks more than the paper's in
      thirteen places, and that the rate and convergence in Theorem 1.1 are not part of the formal statements. The
      package has no licence file. The authors say in the paper's release that the write-up is unpolished and that
      after September they could not risk waiting.
