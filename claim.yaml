extra_gaps:
  - title: "The certificate the proof rests on is named by hash and not released"
    spoken: >-
      The existence of the self-similar solution, and so the blow-up, rests on a certificate: an approximate solution
      satisfying explicit inequalities, checked by interval arithmetic outside the formalization. The paper gives the
      certificate's hash and says it will be released soon. Until it is, with the program that checks it, the formal
      development establishes only that a certificate of the stated form would imply blow-up.
    what: "the authors release the certificate, matching the hash 3f7a335b84b6c7631742cacc5343dfcd11cf72f5221ff79b2b9268790b4b22c5 given in the paper, and the interval-arithmetic program that checks it against the conditions of Appendix B, pinned by hash and date; then an independent rerun of that check"
    who: "the authors; then anyone with FLINT and Arb and a few hours"
    kind: data_release
    ask: "The certificate and its checking program, released and pinned; then one independent rerun of the check."
    expected_signal: "a data cycle pinning the certificate and program, whose hash matches the paper's; then a rerun cycle reporting the check's result"
  - title: "The formal statements stop short of the paper's, and the formal proofs do not follow the paper's"
    spoken: >-
      By the development's own README, the formalization came first and the paper was rewritten with simpler arguments
      and citations in place of proofs, so the two share statements but not proofs; the certificate step is formalized
      only to a weak profile, with smoothness, closeness and rate left to the paper; and the formal definition of a
      certificate asks more than the paper's in thirteen places. Whether the formal theorems and the paper's are the
      same claims is a reading, item by item.
    what: "a reader with the paper and the Lean statement files checks each of the README's stated differences and signs or refuses that the formal theorems carry the paper's claims"
    who: "an analyst who reads Lean, a few hours with the README's list"
    kind: read
    ask: "A reading of the README's list of differences between the formal statements and the paper's, signed or refused one by one."
    expected_signal: "a read cycle listing each difference as immaterial, material or unresolved"
